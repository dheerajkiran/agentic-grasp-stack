[project]
name = "agentic-grasp-stack"
version = "0.1.0"
description = "Multi-agent language-conditioned manipulation stack (PyBullet + ROS2 + Claude agents)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pybullet-arm64>=3.2.8",
    "numpy>=1.26",
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "pillow>=12.3.0",
    "accelerate>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_grasp_stack"]
